<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C12033">
  <meta name="robots" content="noindex">
  <title>Study Tables</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C12033'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">MSOE</span>
      <h1>Study Tables</h1>
    </div>
    <div class="topbar-right">
      <select id="season-picker" aria-label="Season"></select>
      <button id="save-status" class="save-status" type="button" aria-live="polite"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="take" type="button"><span class="tab-icon" aria-hidden="true">✓</span>Attendance</button>
    <button data-tab="stats" type="button"><span class="tab-icon" aria-hidden="true">★</span>Stats</button>
    <button data-tab="history" type="button"><span class="tab-icon" aria-hidden="true">≡</span>History</button>
    <button data-tab="settings" type="button"><span class="tab-icon" aria-hidden="true">⚙</span>Settings</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
